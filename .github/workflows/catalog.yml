name: catalog

# Rebuilds the module catalog across every CloudDrove organisation, including
# submodules, and the AI readable indexes. Uses only the built-in GITHUB_TOKEN.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/generate_catalog.py"
      - ".github/workflows/catalog.yml"

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    name: Rebuild catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_catalog.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "clouddrove-ci"
          git config user.email "clouddrove-ci@clouddrove.com"

          FILES="README.md MODULES.md llms.txt llms-full.txt catalog.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No catalog changes."
            exit 0
          fi
          git add $FILES
          git commit -m "chore: rebuild module catalog [skip ci]"

          # Another run may have pushed while this one was generating. Rebase
          # and regenerate rather than clobbering it.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)."
            git pull --rebase --autostash origin master || git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
