name: catalog

# Rebuilds the module catalog across every CloudDrove organisation, including
# submodules, and the AI readable indexes. Uses only the built-in GITHUB_TOKEN.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/generate_catalog.py"
      - ".github/workflows/catalog.yml"

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  catalog:
    name: Rebuild catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_catalog.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "clouddrove-ci"
          git config user.email "clouddrove-ci@clouddrove.com"

          FILES="README.md llms.txt llms-full.txt catalog.json"

          # The generator stamps a timestamp into every artifact, so the files
          # always differ. Only commit when something other than that timestamp
          # changed, otherwise this would push a junk commit every night.
          if ! git diff --quiet -- $FILES; then
            SUBSTANTIVE=$(git diff -U0 -- $FILES \
              | grep -E '^[+-]' \
              | grep -vE '^(\+\+\+|---)' \
              | grep -viE 'generated_at|^[+-]Generated 20' \
              | head -1 || true)
            if [ -z "$SUBSTANTIVE" ]; then
              echo "Only the generated-at timestamp changed. Nothing to commit."
              exit 0
            fi
          else
            echo "No catalog changes."
            exit 0
          fi

          # These files are fully generated, so on a race the right move is to
          # take the other run's history and re-apply our freshly generated
          # content on top. Rebasing generated content just conflicts.
          TMP=$(mktemp -d)
          cp $FILES "$TMP/"

          for attempt in 1 2 3; do
            git fetch -q origin master
            git reset -q --hard origin/master
            cp "$TMP"/* .
            if git diff --quiet -- $FILES; then
              echo "Another run already published this content."
              exit 0
            fi
            git add $FILES
            git commit -q -m "chore: rebuild module catalog [skip ci]"
            if git push -q; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, retrying (attempt $attempt)."
            sleep $((attempt * 5))
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
