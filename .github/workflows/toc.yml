name: toc        
# Superseded by catalog.yml, which covers every CloudDrove organisation plus
# submodules and the AI readable indexes. This workflow has failed on every
# scheduled run since 2026-02-23, so the schedule is removed and it is kept
# for manual use only.
on:
  workflow_dispatch:
  
jobs:
  toc:
    name: 'toc update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      
      - name: 'create readme'
        uses: 'clouddrove/github-actions@v9.0.3'
        with:  
          actions_subcommand: 'toc'
          modules: 'terraform-aws,terraform-azure,terraform-gcp,docker,ansible,tools'
          github_token: ${{ secrets.GITHUB }}
          
      - name: 'push readme'
        uses: 'clouddrove/github-actions@v9.0.3'
        continue-on-error: true
        with:
          actions_subcommand: 'push'
        env:
          github_token: ${{ secrets.GITHUB }}
